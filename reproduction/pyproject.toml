[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-research-reimplementation"
version = "0.1.0"
description = "Independent educational reimplementation; not the 2025 published source"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
